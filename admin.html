<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Kartech Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<!-- LOGIN -->
<section class="login" id="loginView" hidden>
  <form class="login-card" id="loginForm" novalidate>
    <div class="wordmark">KARTECH<span>ENGINEERING</span></div>
    <h1>Admin</h1>
    <p>Sign in to see orders and custom requests.</p>
    <label class="field"><span>Email</span><input type="email" id="loginEmail" autocomplete="username" required></label>
    <label class="field"><span>Password</span><input type="password" id="loginPass" autocomplete="current-password" required></label>
    <button type="submit" class="btn green" id="loginBtn">Sign in</button>
    <p class="msg err" id="loginMsg" role="alert"></p>
  </form>
</section>

<!-- SETUP MISSING -->
<section class="login" id="setupView" hidden>
  <div class="login-card">
    <div class="wordmark">KARTECH<span>ENGINEERING</span></div>
    <h1>Almost ready</h1>
    <p>Open <strong>js/admin.js</strong> and paste your Supabase URL and key into the ADMIN SETTINGS at the top.</p>
  </div>
</section>

<!-- APP -->
<div id="appView" hidden>
  <header class="top">
    <div class="wordmark">KARTECH<span>ENGINEERING · ADMIN</span></div>
    <div class="top-right">
      <span class="who" id="whoAmI"></span>
      <button type="button" class="btn line" id="refreshBtn">Refresh</button>
      <button type="button" class="btn line" id="logoutBtn">Sign out</button>
    </div>
  </header>
  <nav class="tabs">
    <button type="button" class="on" data-tab="orders">Orders<span class="count" id="countOrders"></span></button>
    <button type="button" data-tab="requests">Custom requests<span class="count" id="countRequests"></span></button>
  </nav>
  <div class="wrap">
    <div class="list-col">
      <div class="tools"><input type="search" id="search" placeholder="Search by number, name or phone"></div>
      <div class="chips" id="chips"></div>
      <div class="rows" id="rows"></div>
    </div>
    <aside class="detail" id="detail"><p class="detail-empty">Select an order to see the details.</p></aside>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/admin.js"></script>
</body>
</html>
